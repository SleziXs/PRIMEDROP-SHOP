<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeDrop Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-color: #f59e0b;
            --text-color: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }
        h1, h2, h3 { margin: 0 0 10px 0; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent-color);
        }
        .cart-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            padding: 12px;
        }
        .product-img {
            width: 100%;
            height: 180px;
            background: #222;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
        }
        .product-title {
            font-size: 16px;
            font-weight: 700;
            margin-top: 10px;
        }
        .product-price {
            color: var(--accent-color);
            font-weight: 800;
            font-size: 18px;
            margin: 6px 0;
        }
        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .cart-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }
        .cart-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            margin: 40px auto;
            max-height: 80vh;
            overflow-y: auto;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">PRIMEDROP ⚡</div>
        <button class="cart-btn" onclick="toggleCart()">🛒 Kosár (<span id="cart-count">0</span>)</button>
    </div>

    <div class="products-grid">
        <div class="product-card">
            <div class="product-img">Nike Dunk Low 'Panda'</div>
            <div class="product-title">Nike Dunk Low 'Panda'</div>
            <div class="product-price">49 990 Ft</div>
            <button class="btn" onclick="addToCart('Nike Dunk Low Panda', 49990)">Kosárba ⚡</button>
        </div>
        <div class="product-card">
            <div class="product-img">Trapstar Puffer Jacket</div>
            <div class="product-title">Trapstar Irongate Puffer</div>
            <div class="product-price">89 990 Ft</div>
            <button class="btn" onclick="addToCart('Trapstar Irongate Puffer', 89990)">Kosárba ⚡</button>
        </div>
    </div>

    <div id="cartModal" class="cart-modal">
        <div class="cart-content">
            <h2>Kosár tartalma</h2>
            <div id="cart-items"></div>
            <h3>Összesen: <span id="cart-total">0</span> Ft</h3>
            <button class="btn" onclick="checkout()">Rendelés leadása 🚀</button>
            <button class="btn" style="background:#333; color:#fff; margin-top:10px;" onclick="toggleCart()">Bezárás</button>
        </div>
    </div>

    <script>
        let cart = [];
        const tg = window.Telegram.WebApp;
        tg.expand();

        function addToCart(name, price) {
            cart.push({name, price});
            document.getElementById('cart-count').innerText = cart.length;
            tg.HapticFeedback.impactOccurred('medium');
            alert(name + ' hozzáadva a kosárhoz!');
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
                renderCart();
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item) => {
                total += item.price;
                container.innerHTML += `<div class="cart-item"><span>${item.name}</span><span>${item.price} Ft</span></div>`;
            });
            document.getElementById('cart-total').innerText = total;
        }

        function checkout() {
            if(cart.length === 0) {
                alert('A kosarad üres!');
                return;
            }
            let text = "Új rendelés a Mini Appból:\n";
            cart.forEach(i => text += `- ${i.name} (${i.price} Ft)\n`);
            tg.sendData(text);
        }
    </script>
</body>
</html>

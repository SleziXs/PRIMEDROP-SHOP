<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeDrop Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --border-color: #2e3440;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            padding-bottom: 90px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-logo span {
            color: var(--accent-color);
        }

        .motto {
            font-size: 13px;
            color: var(--text-sub);
            font-style: italic;
            margin-bottom: 20px;
        }

        .info-btn {
            background-color: #262a36;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 5px 0;
        }

        .product-price {
            font-size: 15px;
            color: #60a5fa;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .option-group {
            margin-bottom: 10px;
        }

        .option-group label {
            display: block;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: #12141a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .add-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Kosár sáv alul */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        .checkout-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Modal ablakok */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .faq-item {
            margin-bottom: 15px;
        }

        .faq-q {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .faq-a {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .close-btn {
            width: 100%;
            background-color: #374151;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #12141a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
        }

        /* Sikeres rendelés felugró */
        .success-box {
            text-align: center;
            padding: 20px;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 10px;
            color: var(--success-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-logo">PRIME<span>DROP</span></div>
        <button class="info-btn" onclick="openModal('faqModal')">ℹ️ GYIK & Infó</button>
    </div>
    <div class="motto">"A te stílusod, a mi küldetésünk. – PrimeDrop"</div>

    <!-- TERMÉK 1 -->
    <div class="product-card">
        <div class="product-title">Polo Ralph Lauren Mellény</div>
        <div class="product-price">26 800 Ft</div>
        
        <div class="option-group">
            <label>Szín</label>
            <select id="color-1">
                <option value="Fekete">Fekete</option>
            </select>
        </div>

        <div class="option-group">
            <label>Méret</label>
            <select id="size-1">
                <option value="S">S</option>
            </select>
        </div>

        <button class="add-btn" onclick="addToCart('Polo Ralph Lauren Mellény', 26800, 'color-1', 'size-1')">Kosárba 🛒</button>
    </div>

    <!-- TERMÉK 2 -->
    <div class="product-card">
        <div class="product-title">Polo Ralph Lauren 2 részes szett</div>
        <div class="product-price">14 990 Ft</div>
        
        <div class="option-group">
            <label>Színkombináció</label>
            <select id="color-2">
                <option value="Fehér póló + Fehér nadrág">Fehér póló + Fehér nadrág</option>
            </select>
        </div>

        <div class="option-group">
            <label>Méret</label>
            <select id="size-2">
                <option value="130cm (125-130cm)">130cm (125-130cm)</
